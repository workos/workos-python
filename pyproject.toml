[project]
name = "workos"
version = "10.8.0"
description = "WorkOS Python Client"
readme = "README.md"
license = "MIT"
authors = [{ name = "WorkOS", email = "sdk@workos.com" }]
requires-python = ">=3.10"

dependencies = [
  "cryptography~=50.0",
  "httpx2~=2.13",
  "pyjwt~=2.12",
  "typing_extensions~=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Identity token providers for workload identity federation. Each is its own
# distribution; installing one does not select it.
github-actions = ["workos-workload-identity-github-actions>=0.1,<1"]
gcp = ["workos-workload-identity-gcp>=0.1,<1"]
aws = ["workos-workload-identity-aws>=0.1,<1"]

[project.urls]
Homepage = "https://workos.com/docs/sdks/python"
Documentation = "https://workos.com/docs/reference"
Changelog = "https://github.com/workos/workos-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "type_check" },
  { include-group = "nox" },
  "pyright~=1.1",
]
test = [
  "pytest~=9.0",
  "pytest-asyncio~=1.3",
  "pytest-cov~=7.1",
  "httpx~=0.28",
]
lint = ["ruff~=0.15"]
type_check = ["pyright~=1.1", "httpx~=0.28"]
nox = ["nox~=2026.2", "nox-uv~=0.7"]
docs = ["pdoc>=14", "pydoc-markdown>=4", "black~=26.3"]


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
# The provider distributions under packages/ run their own tests.
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv.build-backend]
source-include = ["py.typed"]
source-exclude = ["tests*"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
workos-workload-identity-github-actions = { workspace = true }
workos-workload-identity-gcp = { workspace = true }
workos-workload-identity-aws = { workspace = true }

[tool.pyright]
typeCheckingMode = "strict"
include = ["workos"]

[build-system]
requires = ["uv_build~=0.11"]
build-backend = "uv_build"
